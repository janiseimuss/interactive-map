<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kartes redaktors</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div id="editor-toolbar">
    <button id="export-json-btn">Eksportēt JSON</button>
  </div>

  <div id="map"></div>

  <div id="legend">
    <h4>Leģenda</h4>

    <div class="legend-item">
      <div class="legend-symbol">
        <div class="symbol-circle-yellow"></div>
      </div>
      <div>Tele2 BS</div>
    </div>

    <div class="legend-item">
      <div class="legend-symbol">
        <div class="symbol-circle-purple"></div>
      </div>
      <div>Tele2 HUB</div>
    </div>

    <div class="legend-item">
      <div class="legend-symbol">
        <div class="symbol-triangle-bluegray"></div>
      </div>
      <div>LVRTC maģistrālais piekļuves punkts</div>
    </div>

    <div class="legend-item">
      <div class="legend-symbol">
        <div class="symbol-square-red"></div>
      </div>
      <div>Tet PM</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="editor.js?v=5"></script>
</body>
</html>
